# DVC pipeline: `dvc repro` re-runs only the stages whose deps/params changed.
# Raw data (GBG500 from Inside) is versioned with `dvc add data/raw/GBG500.parquet data/raw/GBG500_labels.csv`.
stages:
  prepare:
    cmd: python -m fraud_detection.data prepare
    deps:
      - data/raw/GBG500.parquet
      - data/raw/GBG500_labels.csv
      - src/fraud_detection/data.py
    params:
      - seed
      - data
    outs:
      - data/processed:
          persist: false

  train:
    cmd: python -m fraud_detection.train
    deps:
      - data/processed
      - src/fraud_detection/model.py
      - src/fraud_detection/train.py
      - src/fraud_detection/evaluate.py
    params:
      - seed
      - windows
      - model
      - train
      - quality_gate
    metrics:
      - metrics.json:
          cache: false
