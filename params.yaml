# Single source of truth for all hyperparameters and settings.
# Read by the Python code AND by DVC (dvc.yaml -> params) so any change
# here invalidates the right pipeline stages.

seed: 42

data:
  # GBG500 dataset (from Inside), versioned with DVC
  raw_path: data/raw/GBG500.parquet
  labels_path: data/raw/GBG500_labels.csv
  processed_dir: data/processed
  # Split BY RIDE (never by sample) and stratified on the 5 classes
  test_size: 0.15
  val_size: 0.15

# Each ride (10 Hz) is cut into fixed-length windows; the ride prediction is the
# average of its window probabilities (same logic at training and serving time).
windows:
  length: 300   # 30 s
  stride: 150   # 50 % overlap

model:
  channels: [32, 64, 128]
  kernel_size: 5
  dropout: 0.3

train:
  epochs: 30
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  # Class weights in the loss: "balanced" = inverse class frequency (on rides), "none"
  class_weight: balanced
  early_stopping_patience: 6

mlflow:
  experiment_name: ride-classification
  # Name and alias loaded by the API (see docs/api-contract.md)
  registered_model_name: ride-classifier
  champion_alias: champion

# Quality gate: a model below this bar is never promoted and the training command
# exits with an error (red CI). It must also beat the "always predict Safe" baseline.
quality_gate:
  min_test_macro_f1: 0.30
