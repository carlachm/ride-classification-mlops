# Training workflow (course "workflow 2"): train, check the quality gate,
# promote the model in MLflow only if it is good enough.
#
# Runs on a SELF-HOSTED runner (your machine) because it needs the MLflow
# server and MinIO started with `make up`, which GitHub's cloud runners cannot reach.
# Heavy training never runs on every push: manual button, or called later by
# Airflow / the retraining pipeline (workflow_call).
name: train

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why retrain? (written to the run summary and to the MLflow run)"
        required: false
        default: "manual"
        type: string
  workflow_call:
    inputs:
      reason:
        required: false
        default: "called by another workflow"
        type: string

concurrency:
  group: train
  cancel-in-progress: false  # never kill a training run halfway

permissions:
  contents: read

jobs:
  train:
    name: train
    runs-on: self-hosted
    timeout-minutes: 60
    outputs:
      promoted: ${{ steps.gate.outputs.promoted }}
    env:
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI || 'http://localhost:5000' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      # Free text: passed through the environment, never interpolated into a script (no shell injection)
      RETRAIN_REASON: ${{ inputs.reason }}
    steps:
      - name: Why this run
        run: |
          echo "### Training run" >> "$GITHUB_STEP_SUMMARY"
          printf 'Reason: %s\n' "$RETRAIN_REASON" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - name: Install
        run: uv sync --locked
      - name: Configure DVC remote and pull the versioned data
        run: |
          bash scripts/setup_dvc.sh
          uv run --no-sync dvc pull
      - name: Prepare + train (exits 1 if the quality gate fails)
        run: uv run --no-sync dvc repro --force
      - name: Was the new version promoted?
        id: gate
        run: uv run --no-sync python -c "import json; print('promoted=' + str(json.load(open('metrics.json'))['promoted']).lower())" >> "$GITHUB_OUTPUT"
      - name: Metrics
        if: always()
        run: |
          echo "### Training metrics" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat metrics.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Manual approval before the new model reaches the API: the API loads @champion at startup, so
  # "deploying" a promoted model is restarting it. Setup by the repository OWNER, in this order:
  #   1. Settings > Environments > production > Required reviewers
  #   2. Settings > Secrets and variables > Actions > variable PRODUCTION_APPROVAL = on
  # The variable is a lock: without it the job is skipped. GitHub creates a missing environment with
  # NO protection, which would restart the API without anybody's approval.
  deploy:
    name: deploy-champion
    needs: train
    if: needs.train.outputs.promoted == 'true' && vars.PRODUCTION_APPROVAL == 'on'
    runs-on: self-hosted
    timeout-minutes: 15
    environment: production
    steps:
      - name: Restart the API so that it loads the new champion
        run: |
          kubectl -n ride rollout restart deployment/ride-api
          if ! kubectl -n ride rollout status deployment/ride-api --timeout=300s; then
            kubectl -n ride rollout undo deployment/ride-api
            exit 1
          fi
          echo "### API restarted with the approved model :rocket:" >> "$GITHUB_STEP_SUMMARY"
