global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The API started on the host with `make api` (or the API container publishing port 8000).
  # Kubernetes is NOT scraped from here: a port-forward reaches a single pod, so the counters of the
  # 2 replicas would be wrong. See "Limits" in docs/monitoring.md.
  - job_name: ride-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels: {env: dev}
